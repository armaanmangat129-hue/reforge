    .eyebrow::before { content: ""; width: 18px; height: 1px; background: var(--gold); }
    h1 { margin: 8px 0 12px; font: 600 clamp(2.25rem, 1.8rem + 2vw, 3rem)/1.1 "Cormorant Garamond", Georgia, serif; }
    p { margin: 0 auto 28px; max-width: 36ch; color: var(--text-muted); }
